<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authentication - GOD4XE</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body style="align-items: center; justify-content: center; padding: 2rem;">

  <div class="admin-card" style="max-width: 440px; width: 100%; padding: 2.5rem; border-color: var(--neon-purple); box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2rem; font-weight: 900; letter-spacing: 2px; color: #fff;">
        GOD4XE <span style="color: var(--neon-purple);">ADMIN</span>
      </div>
      <p style="color: var(--admin-muted); font-size: 0.85rem; margin-top: 0.35rem;">
        Restricted Portal • Non-Technical Management Console
      </p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span>⚠️ {{ error }}</span>
    </div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-admin-primary" style="width: 100%; justify-content: center; font-size: 1rem;">
        Authenticate & Enter
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem;">
      <a href="/" style="color: var(--admin-dim); text-decoration: none; font-size: 0.8rem;">&larr; Return to Public Website</a>
    </div>
  </div>

</body>
</html>
