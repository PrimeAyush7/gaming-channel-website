{% extends "admin/base.html" %}

{% block header_title %}Tags Management{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: 1fr 1.8fr; gap: 2rem;">
  
  <!-- Add Tag -->
  <div class="admin-card">
    <div class="admin-card-header">
      <div class="admin-card-title">➕ Add New Tag</div>
    </div>

    <form action="/admin/tags/new" method="POST">
      <input type="hidden" name="csrf_token" value="{{ admin.csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="name">Tag Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. OB53, HEADSHOT, SENSITIVITY" required>
      </div>

      <button type="submit" class="btn-admin-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
        Add Tag
      </button>
    </form>
  </div>

  <!-- Tag List -->
  <div class="admin-card">
    <div class="admin-card-header">
      <div class="admin-card-title">Existing Tags ({{ tags | length }})</div>
    </div>

    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tag Name</th>
            <th>Slug</th>
            <th>Assigned Posts</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for tag in tags %}
          <tr>
            <td><strong style="color: var(--neon-violet);">#{{ tag.name }}</strong></td>
            <td style="color: var(--admin-dim);">{{ tag.slug }}</td>
            <td><span class="badge badge-purple">{{ tag.post_count }}</span></td>
            <td>
              <form action="/admin/tags/delete/{{ tag.id }}" method="POST" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ admin.csrf_token }}">
                <button type="submit" class="btn-sm btn-delete" data-confirm="Delete tag #{{ tag.name }}?">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}
