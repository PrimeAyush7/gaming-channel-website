<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Crest Icon -->
  <polygon points="32,4 56,16 56,48 32,60 8,48 8,16" fill="#140a33" stroke="#a855f7" stroke-width="2.5" filter="url(#neonGlow)"/>
  <polygon points="32,12 48,22 48,42 32,52 16,42 16,22" fill="#0d0722" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M24,32 L32,24 L40,32 L32,40 Z" fill="url(#logoGrad)" filter="url(#neonGlow)"/>
  
  <!-- Text Brand -->
  <text x="70" y="38" font-family="'Orbitron', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="#ffffff">
    GOD4XE<tspan fill="#c084fc" filter="url(#neonGlow)">GAMING</tspan>
  </text>
  <text x="72" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="5" fill="#a855f7">
    OFFICIAL CONTENT HUB
  </text>
</svg>
