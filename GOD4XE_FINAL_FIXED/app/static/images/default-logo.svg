<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <clipPath id="logoImageClip">
    <rect x="6" y="6" width="52" height="52" rx="8" ry="8" />
  </clipPath>
  <!-- GOD4XE Image Logo Icon -->
  <rect x="5" y="5" width="54" height="54" rx="9" fill="#140a33" stroke="#a855f7" stroke-width="1.5" filter="url(#neonGlow)"/>
  <image href="/static/images/1000074856.jpg.jpeg" x="6" y="6" width="52" height="52" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoImageClip)"/>
  
  <!-- Text Brand -->
  <text x="70" y="38" font-family="'Orbitron', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="3" fill="#ffffff">
    GOD4XE<tspan fill="#c084fc" filter="url(#neonGlow)">GAMING</tspan>
  </text>
  <text x="72" y="52" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="5" fill="#a855f7">
    OFFICIAL CONTENT HUB
  </text>
</svg>
