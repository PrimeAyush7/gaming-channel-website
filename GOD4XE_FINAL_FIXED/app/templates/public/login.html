{% extends "public/base.html" %}
{% block title %}Login - GOD4XE{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;padding:3rem 1rem 5rem;">
  <div class="card" style="padding:2rem;background:rgba(18,8,35,.9);border:1px solid rgba(168,85,247,.35);border-radius:16px;">
    <h1 style="color:#fff;margin-bottom:.5rem;">Login to GOD4XE</h1>
    <p style="color:var(--text-muted);margin-bottom:1.5rem;">Login on the website to join Free Fire tournaments directly.</p>
    {% if error %}<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:.8rem;border-radius:8px;margin-bottom:1rem;">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <input type="hidden" name="next_url" value="{{ next_url or '/tournaments' }}">
      <label>Username / Email / Phone</label>
      <input name="identity" class="form-control" required style="margin:.4rem 0 1rem;">
      <label>Password</label>
      <input name="password" type="password" class="form-control" required style="margin:.4rem 0 1.25rem;">
      <button class="btn btn-primary" type="submit" style="width:100%;">Sign In</button>
    </form>
    <p style="text-align:center;color:var(--text-muted);margin-top:1.25rem;">Don't have an account? <a href="/register" style="color:#c084fc;">Register Now</a></p>
  </div>
</div>
{% endblock %}
