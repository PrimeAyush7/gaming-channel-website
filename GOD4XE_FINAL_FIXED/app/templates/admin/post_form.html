{% extends "admin/base.html" %}

{% block header_title %}{% if post %}Edit Post #{{ post.id }}{% else %}Create New Post{% endif %}{% endblock %}

{% block content %}
<div class="admin-card" style="max-width: 1000px;">
  <form action="{% if post %}/admin/posts/edit/{{ post.id }}{% else %}/admin/posts/new{% endif %}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ admin.csrf_token }}">

    <!-- Title & Slug -->
    <div class="form-group">
      <label class="form-label" for="title">Post Title *</label>
      <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" class="form-control" placeholder="e.g. OB52 Update: Best Headshot Sensitivity & Config" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="slug">URL Slug (Auto-generated if empty)</label>
        <input type="text" id="slug" name="slug" value="{{ post.slug if post else '' }}" class="form-control" placeholder="ob52-best-headshot-sensitivity">
      </div>

      <div class="form-group">
        <label class="form-label" for="section_id">Dynamic Category / Section</label>
        <select id="section_id" name="section_id" class="form-control">
          <option value="">-- None / General --</option>
          {% for sec in sections %}
          <option value="{{ sec.id }}" {% if post and post.section_id == sec.id %}selected{% endif %}>
            {{ sec.icon }} {{ sec.name }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Summary -->
    <div class="form-group">
      <label class="form-label" for="summary">Short Summary / Excerpt</label>
      <textarea id="summary" name="summary" class="form-control" style="min-height: 70px;" placeholder="Brief synopsis for homepage cards and meta description...">{{ post.summary if post else '' }}</textarea>
    </div>

    <!-- Content Editor -->
    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <label class="form-label" for="content-editor" style="margin-bottom: 0;">Main Article Content *</label>
        <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;">
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="h2">H2</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="h3">H3</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="bold">B</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="italic">I</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="quote">Quote</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="code">Code</button>
          <button type="button" class="btn-sm btn-edit" data-editor-cmd="link">Link</button>
        </div>
      </div>
      <textarea id="content-editor" name="content" class="form-control" style="min-height: 280px;" placeholder="Write complete guide content here. Markdown headings, lists, and links are supported." required>{{ post.content if post else '' }}</textarea>
    </div>

    <!-- Media & Integrations -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="thumbnail_url">Thumbnail URL</label>
        <input type="text" id="thumbnail_url" name="thumbnail_url" value="{{ post.thumbnail_url if post else '' }}" class="form-control" placeholder="/static/uploads/image.webp or image URL">
        <div style="font-size: 0.75rem; color: var(--admin-dim); margin-top: 0.35rem;">
          Tip: Upload images in <a href="/admin/media" target="_blank" style="color: var(--neon-purple);">Media Library</a> and paste the link here.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="youtube_video_id">YouTube Video URL or 11-char ID</label>
        <input type="text" id="youtube_video_id" name="youtube_video_id" value="{{ post.youtube_video_id if post else '' }}" class="form-control" placeholder="https://www.youtube.com/watch?v=... or ID">
      </div>
    </div>

    <!-- Download System -->
    <div class="form-row" style="background: rgba(16, 185, 129, 0.05); padding: 1rem; border: 1px dashed rgba(16, 185, 129, 0.3); border-radius: 8px; margin-bottom: 1.25rem;">
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="download_url" style="color: #34d399;">External Download Link (Safe URL)</label>
        <input type="url" id="download_url" name="download_url" value="{{ post.download_url if post else '' }}" class="form-control" placeholder="https://drive.google.com/... or https://mediafire.com/...">
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="download_label" style="color: #34d399;">Download Button Label</label>
        <input type="text" id="download_label" name="download_label" value="{{ post.download_label if post else 'DOWNLOAD CONFIG FILE' }}" class="form-control" placeholder="DOWNLOAD FILE">
      </div>
    </div>

    <!-- Tags -->
    <div class="form-group">
      <label class="form-label" for="tags">Tags (Comma-separated)</label>
      <input type="text" id="tags" name="tags" value="{% if post and post.tags %}{% for t in post.tags %}{{ t.name }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}" class="form-control" placeholder="OB52, CONFIG, SENSITIVITY, FREE FIRE">
    </div>

    <!-- SEO Overrides -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="seo_title">Custom SEO Title (Optional)</label>
        <input type="text" id="seo_title" name="seo_title" value="{{ post.seo_title if post else '' }}" class="form-control" placeholder="Defaults to post title if blank">
      </div>

      <div class="form-group">
        <label class="form-label" for="seo_description">Custom Meta Description (Optional)</label>
        <input type="text" id="seo_description" name="seo_description" value="{{ post.seo_description if post else '' }}" class="form-control" placeholder="Defaults to summary if blank">
      </div>
    </div>

    <!-- Status Toggles -->
    <div style="display: flex; gap: 1rem; margin: 1.5rem 0 2rem; flex-wrap: wrap;">
      <label class="toggle-label">
        <input type="checkbox" name="is_published" value="1" {% if not post or post.is_published %}checked{% endif %}>
        <span><strong>Published</strong> (Live on website)</span>
      </label>

      <label class="toggle-label">
        <input type="checkbox" name="is_featured" value="1" {% if post and post.is_featured %}checked{% endif %}>
        <span>⭐ <strong>Featured Post</strong> (Highlighted on homepage)</span>
      </label>
    </div>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
      <button type="submit" class="btn-admin-primary">
        💾 Save & Publish Post
      </button>
      <a href="/admin/posts" class="btn-sm btn-edit" style="padding: 0.75rem 1.25rem;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
